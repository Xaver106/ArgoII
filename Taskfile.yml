version: '3'

tasks:
  local-rebuild:*:
    aliases: [ lrb:* ]
    desc: rebuild this system, without clan
    vars:
      REBUILD_OPERATION: '{{index .MATCH 0}}'
      NIX_CONF_DIR: '{{.TASKFILE_DIR}}'
      HOST:
        sh: hostname
    cmds:
      - sudo systemd-inhibit nixos-rebuild {{.REBUILD_OPERATION}} --flake {{.TASKFILE_DIR}}#{{.HOST}}
    requires:
      vars:
        - name: REBUILD_OPERATION
          enum: [ switch, boot ]

  local-rebuild:
    aliases: [ lrb ]
    cmds:
      - task: local-rebuild:switch
  
  flake-update:
    aliases: [ update, u ]
    desc: Update flake inputs
    cmds:
      - nix flake update

  flake-check:
    aliases: [ fc, check ]
    desc: Check if the flake evaluates
    cmds:
      - nix flake check

  flake-lock:
    aliases: [ fl, lock ]
    desc: Add new depends to the lockfile
    cmds:
      - nix flake lock

  commit-lockfile:
    aliases: [ commit-lock, git-lock ]
    desc: Commit the updated flake.lock
    cmds:
      - 'git commit flake.lock -m "chore(flake): updated lockfile"'

  garbage-collect:
    aliases: [ gc ]
    desc: Delete old profiles and run garbage collector
    cmds:
      - sudo nix-collect-garbage -d
      - sudo /run/current-system/bin/switch-to-configuration boot
